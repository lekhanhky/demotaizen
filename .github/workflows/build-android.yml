name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép chạy manual

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Install dependencies
      run: npm ci

    - name: Setup Expo CLI
      run: npm install -g @expo/cli

    - name: Generate Android project
      run: npx expo prebuild --platform android --clean

    - name: Create gradle.properties with mirror repositories
      run: |
        mkdir -p ~/.gradle
        cat > ~/.gradle/gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m
        org.gradle.parallel=true
        org.gradle.configureondemand=true
        org.gradle.daemon=false
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

    - name: Create init.gradle with mirror repositories
      run: |
        cat > ~/.gradle/init.gradle << 'EOF'
        allprojects {
            repositories {
                google {
                    content {
                        includeGroupByRegex "com\\.android.*"
                        includeGroupByRegex "com\\.google.*"
                        includeGroupByRegex "androidx.*"
                    }
                }
                maven {
                    url "https://maven.aliyun.com/repository/public"
                    content {
                        includeGroupByRegex "org\\.jetbrains.*"
                        includeGroupByRegex "io\\.netty.*"
                    }
                }
                maven {
                    url "https://maven.aliyun.com/repository/central"
                }
                maven {
                    url "https://repo1.maven.org/maven2/"
                }
                mavenCentral()
                gradlePluginPortal()
            }
        }
        EOF

    - name: Make gradlew executable
      run: chmod +x android/gradlew

    - name: Build APK with offline mode fallback
      run: |
        cd android
        echo "Attempting online build..."
        if timeout 600 ./gradlew assembleRelease --no-daemon --stacktrace --info; then
          echo "✅ Online build successful"
        else
          echo "❌ Online build failed, trying with cached dependencies..."
          ./gradlew assembleRelease --offline --no-daemon || {
            echo "❌ Offline build also failed"
            exit 1
          }
        fi

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30

    - name: Get APK info
      run: |
        APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
        if [ -f "$APK_PATH" ]; then
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "✅ APK built successfully!"
          echo "📱 Size: $APK_SIZE"
          echo "📂 Path: $APK_PATH"
        else
          echo "❌ APK not found!"
        fi